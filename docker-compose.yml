services:

  # =========================
  # MongoDB
  # =========================
  mongo:
    image: mongo:8
    container_name: mongodb-devTinder

    ports:
      - "${MONGO_PORT}:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mongo-data:/data/db


  # =========================
  # Backend
  # =========================
  backend:
    build: ./devTinder
    container_name: devtinder-backend

    ports:
      - "${BACKEND_PORT}:5000"

    volumes:
      - ./devTinder:/app
      - /app/node_modules

    env_file:
      - ./devTinder/.env

    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - mongo

    restart: unless-stopped


  # =========================
  # Frontend
  # =========================
  frontend:
    build: ./devTinder-web
    container_name: devtinder-frontend

    ports:
      - "${FRONTEND_PORT}:5173"

    volumes:
      - ./devTinder-web:/app
      - /app/node_modules

    env_file:
      - ./devTinder-web/.env

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      FAST_REFRESH: "true"

    depends_on:
      - backend

    stdin_open: true
    tty: true

    restart: unless-stopped


  # =========================
  # Mongo Express
  # =========================
  mongo-express:
    image: mongo-express:latest
    container_name: devtinder-mongo-express

    ports:
      - "${MONGO_EXPRESS_PORT}:8081"

    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin

      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}

    depends_on:
      - mongo

    restart: unless-stopped


# =========================
# Volumes
# =========================
volumes:
  mongo-data: